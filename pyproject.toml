[project]
name = "research-assistant"
version = "0.1.0"
description = "赛题一科研助手 Agent（objective-v3 / dispatch-v3）"
requires-python = ">=3.11,<3.12"
dependencies = [
    "fastapi==0.111.0",
    "starlette==0.37.2",
    "pydantic==2.8.0",
    "uvicorn==0.30.0",
    "httpx==0.27.0",
    "anyio==4.15.1",
]

[dependency-groups]
dev = [
    "pytest>=8.3,<9",
    "ruff>=0.6,<1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/research_assistant"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -m 'not live'"
markers = [
    "live: 需要真实模型网关与网络，默认排除；设置 .env.local 后用 -m live 单独运行",
]
# 默认把任何警告升级为失败，只精确豁免三条已知的第三方问题。
# 三者都来自 starlette 0.37.2（为对齐基础镜像而锁定）与本地较新的
# python_multipart / anyio 之间的版本差，不在本项目代码里，
# 也无法在不放松版本锁的前提下消除：
#   1-2. starlette 导入期的两条弃用警告，按消息前缀豁免；
#   3. TestClient 的 portal 拆除时 anyio MemoryObjectStream 在 __del__ 里发的
#      ResourceWarning。从源头按消息前缀豁免它，警告就不会在 __del__ 中抛出，
#      也就不会被 pytest 包装成 PytestUnraisableExceptionWarning——
#      因此 PytestUnraisableExceptionWarning 仍受 "error" 管辖，
#      我们自己代码里的 unraisable 异常照样会让测试失败。
# 任何新警告仍会变成失败。
filterwarnings = [
    "error",
    "ignore:Please use `import python_multipart` instead\\.:PendingDeprecationWarning",
    "ignore:The anyio\\.abc\\.BlockingPortal alias is deprecated:DeprecationWarning",
    "ignore:Unclosed <MemoryObject:ResourceWarning",
]

[tool.ruff]
line-length = 100
target-version = "py311"
# 官方快照只读；work/ 内是模型生成源码，必须保持原样，不得被格式化
# *.md：ruff >= 0.16 会格式化 Markdown 里的 Python 代码块，而本仓库的 md 全是文档/计划，
# 其中代码是示意片段而非源码，不得被自动改写。
extend-exclude = ["docs/references", "work", ".venv", "*.md"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
# RUF001/RUF002/RUF003：中文文档字符串、注释与字符串字面量必然含全角标点，
# 属 ambiguous-unicode 家族规则的已知误报；本项目为中文代码库，故整族忽略
ignore = ["E501", "RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["B011"]
